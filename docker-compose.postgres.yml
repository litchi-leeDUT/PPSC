services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ppsc
      POSTGRES_USER: ppsc
      POSTGRES_PASSWORD: ppsc_dev_only
    ports:
      - "5432:5432"
    volumes:
      - ppsc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppsc -d ppsc"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ppsc_postgres_data:
